# Gera o instalador do Windows.
# - Manual (aba Actions > Run workflow): gera o instalador como artefato.
#   Marcando "publicar", também cria a release da versão do package.json
#   (tag vX.Y.Z) com o instalador e o latest.json da atualização automática.
# - Tag "v0.4.0" etc. enviada pelo git: publica a release do mesmo jeito.
# A atualização automática precisa do segredo TAURI_SIGNING_PRIVATE_KEY no
# repositório (Settings > Secrets and variables > Actions). Sem ele, o build
# funciona igual, só não gera os arquivos de atualização.
name: Instalador Windows

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar como versão oficial (o app instalado recebe a atualização)
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.publicar && 'v__VERSION__' || '') }}
          releaseName: "Bravo Hub v__VERSION__"
          releaseBody: "Baixe o instalador .exe abaixo. Quem já tem o app recebe esta versão pela atualização automática."
          releaseDraft: false
          includeUpdaterJson: ${{ env.HAS_SIGNING_KEY == 'true' }}
          args: ${{ env.HAS_SIGNING_KEY != 'true' && '--config src-tauri/tauri.no-updater.conf.json' || '' }}

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: bravo-hub-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
